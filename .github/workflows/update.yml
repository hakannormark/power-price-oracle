name: Update forecast

# When to run is decided in Stockholm time by src/schedule.py, not here. GitHub
# cron speaks only UTC — an entry that catches the 12:45 auction in summer fires
# before it in winter — and in the first week every scheduled run started four
# to four and a half hours late. So cron only polls; the gate job asks whether a
# slot has passed without a run, and a late or dropped poll is caught up by the
# next one.
on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "site/**"
      - "requirements.txt"
      - ".github/workflows/update.yml"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.due.outputs.due }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Only what the check reads, so a poll with nothing to do costs seconds.
          sparse-checkout: |
            src/
            api/v1/status.json
          sparse-checkout-cone-mode: false

      - id: due
        # Stdlib only; no dependencies to install.
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python3 -m src.schedule api/v1/status.json >> "$GITHUB_OUTPUT"
          else
            echo "due=true" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: gate
    if: needs.gate.outputs.due == 'true'
    runs-on: ubuntu-latest
    concurrency:
      # Serialises every run that commits to data/ — a 13-minute backfill and a
      # scheduled run writing the same JSONL cannot be rebased together.
      group: repo-data
      cancel-in-progress: false
    outputs:
      run_id: ${{ steps.pipeline.outputs.run_id }}
      ran: ${{ steps.due.outputs.due }}
    steps:
      - uses: actions/checkout@v4

      - name: Still due
        id: due
        # A poll can queue behind the run that serves the same slot. Once it
        # holds the lock, ask again against the checkout it got.
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python3 -m src.schedule api/v1/status.json >> "$GITHUB_OUTPUT"
          else
            echo "due=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.due.outputs.due == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.due.outputs.due == 'true'
        run: pip install -r requirements.txt

      - name: Backfill history if thin
        if: steps.due.outputs.due == 'true'
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: python -m src.backfill --if-needed

      - name: Ensure demo fixtures exist
        if: steps.due.outputs.due == 'true'
        # Only used when ENTSOE_TOKEN is unset, so the site still renders.
        run: |
          if [ ! -f data/fixtures/actuals_demo.jsonl ]; then
            python -m src.fixtures --days 14
          fi

      - name: Run pipeline
        id: pipeline
        if: steps.due.outputs.due == 'true'
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: |
          # pipefail: without it the exit status is tee's, so a crashing
          # pipeline reports success and the site silently stops updating.
          set -o pipefail
          python -m src.pipeline | tee run.log
          echo "run_id=$(grep -m1 '^run_id=' run.log | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          rm -f run.log

      - name: Commit updated state
        if: steps.due.outputs.due == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data api site/data site/api
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "chore: update forecast ${{ steps.pipeline.outputs.run_id }}"
            # The schedule can overlap a manual push; rebase rather than fail.
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi

      - uses: actions/configure-pages@v5
        if: steps.due.outputs.due == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.due.outputs.due == 'true'
        with:
          path: site

  deploy:
    needs: update
    if: needs.update.outputs.ran == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
